<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#120b1d">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <script defer src="{{ '/assets/js/site.js' | relative_url }}"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to guide</a>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Grantspace guide home">
        <span class="brand-mark">G</span>
        <span><strong>Grantspace</strong><small>Clinician guide</small></span>
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
      <nav id="site-nav" class="site-nav" aria-label="Guide navigation">
        <a href="{{ '/getting-started/' | relative_url }}">Deploy</a>
        <a href="{{ '/create-a-grant/' | relative_url }}">Create a grant</a>
        <a href="{{ '/teams/' | relative_url }}">Teams</a>
        <a href="{{ '/editor/' | relative_url }}">Write together</a>
        <a href="{{ '/review-and-publish/' | relative_url }}">Review & publish</a>
        <a href="{{ '/troubleshooting/' | relative_url }}">Help</a>
      </nav>
    </header>
    <main id="main-content" class="page-shell">
      {{ content }}
    </main>
    <footer class="site-footer">
      <p><strong>Grantspace</strong> keeps the sponsor ask, evidence, team decisions, versions, and exports in one shared grant workspace.</p>
      <p class="footer-links"><a href="{{ '/getting-started/' | relative_url }}">Start deployment</a><a href="{{ '/troubleshooting/' | relative_url }}">Troubleshooting</a></p>
    </footer>
  </body>
</html>
