services:
  ollama:
    profiles: ["local-model"]
    image: ollama/ollama:0.32.14
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-4096}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
    volumes:
      - grant-ollama-models:/root/.ollama
    ports: ["127.0.0.1:11434:11434"]
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-3g}
    cpus: ${OLLAMA_CPU_LIMIT:-4.0}
    pids_limit: 512
    init: true
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "3"}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 20s

  embedding-cpu:
    profiles: ["cpu-embedding"]
    build:
      context: .
      dockerfile: Dockerfile.embedding-cpu
    environment:
      CPU_EMBEDDING_MODEL: ${CPU_EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      CPU_EMBEDDING_API_MODEL: ${CPU_EMBEDDING_API_MODEL:-grant-embedding-cpu}
      CPU_EMBEDDING_THREADS: ${CPU_EMBEDDING_THREADS:-2}
      CPU_EMBEDDING_BATCH_SIZE: ${CPU_EMBEDDING_BATCH_SIZE:-16}
      FASTEMBED_CACHE_PATH: /models
      OMP_NUM_THREADS: ${CPU_EMBEDDING_THREADS:-2}
      OPENBLAS_NUM_THREADS: 1
      TOKENIZERS_PARALLELISM: "false"
      PYTHONDONTWRITEBYTECODE: "1"
      HOME: /tmp
    volumes:
      - grant-embedding-models:/models
    ports: ["127.0.0.1:8010:8010"]
    mem_limit: ${EMBEDDING_MEMORY_LIMIT:-768m}
    cpus: ${EMBEDDING_CPU_LIMIT:-2.0}
    pids_limit: 256
    read_only: true
    init: true
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs: ["/tmp:size=256m,mode=1777"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=5).read()"]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 30s

  ingestion:
    build:
      context: .
      dockerfile: Dockerfile.ingestion
    environment:
      INGESTION_NAVIGATION_TIMEOUT_MS: ${INGESTION_NAVIGATION_TIMEOUT_MS:-45000}
      INGESTION_MAX_OUTPUT_BYTES: ${INGESTION_MAX_OUTPUT_BYTES:-8388608}
      INGESTION_MAX_CONCURRENCY: ${INGESTION_MAX_CONCURRENCY:-2}
      RESEARCH_USER_AGENT: ${RESEARCH_USER_AGENT:-ClinicalGrantWorkbench/0.8.0}
      PYTHONDONTWRITEBYTECODE: "1"
      HOME: /tmp
    mem_limit: ${INGESTION_MEMORY_LIMIT:-1g}
    cpus: ${INGESTION_CPU_LIMIT:-1.5}
    pids_limit: 384
    read_only: true
    init: true
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs: ["/tmp:size=512m,mode=1777", "/dev/shm:size=256m,mode=1777"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  core:
    build:
      context: .
      dockerfile: Dockerfile.core
    environment:
      GRANT_WORKSPACE: /workspace
      GRANT_RUNTIME_PROFILE: ${GRANT_RUNTIME_PROFILE:-unknown}
      GRANT_BUILD_VERSION: ${GRANT_BUILD_VERSION:-0.8.0}
      GRANT_BUILD_REVISION: ${GRANT_BUILD_REVISION:-development}
      AUTH_MODE: ${AUTH_MODE:-internal_accounts}
      LOCAL_USER_ID: ${LOCAL_USER_ID:-local-admin}
      LOCAL_USER_EMAIL: ${LOCAL_USER_EMAIL:-}
      LOCAL_USER_DISPLAY_NAME: ${LOCAL_USER_DISPLAY_NAME:-Local administrator}
      LOCAL_ORGANIZATION_ID: ${LOCAL_ORGANIZATION_ID:-local-organization}
      INITIAL_ADMIN_SETUP_TOKEN: ${INITIAL_ADMIN_SETUP_TOKEN:-}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-43200}
      PASSWORD_RESET_TTL_SECONDS: ${PASSWORD_RESET_TTL_SECONDS:-1800}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-14}
      PASSWORD_MAX_LENGTH: ${PASSWORD_MAX_LENGTH:-256}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOGIN_LOCK_SECONDS: ${LOGIN_LOCK_SECONDS:-900}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://127.0.0.1:7860}
      MODEL_ROUTING_MODE: ${MODEL_ROUTING_MODE:-hybrid}
      REQUIRE_CLAUDE_IN_HYBRID: ${REQUIRE_CLAUDE_IN_HYBRID:-false}
      LOCAL_LLM_PROVIDER: ${LOCAL_LLM_PROVIDER:-ollama}
      LOCAL_LLM_URL: ${LOCAL_LLM_URL:-${OLMO_URL:-http://ollama:11434/v1/chat/completions}}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_API_MODEL:-${OLMO_API_MODEL:-qwen3:1.7b}}
      LOCAL_LLM_MAX_TOKENS: ${LOCAL_LLM_MAX_TOKENS:-${OLMO_MAX_TOKENS:-4096}}
      LOCAL_LLM_PROMPT_PREFIX: ${LOCAL_LLM_PROMPT_PREFIX:-}
      # OLMO_* remains populated for backward compatibility with older releases.
      OLMO_URL: ${OLMO_URL:-http://ollama:11434/v1/chat/completions}
      OLMO_MODEL: ${OLMO_API_MODEL:-qwen3:1.7b}
      OLMO_MAX_TOKENS: ${OLMO_MAX_TOKENS:-4096}
      EMBEDDING_URL: ${EMBEDDING_URL:-http://embedding-cpu:8010/v1/embeddings}
      EMBEDDING_MODEL: ${EMBEDDING_API_MODEL:-grant-embedding}
      EMBEDDING_DOCUMENT_PREFIX: "${EMBEDDING_DOCUMENT_PREFIX:-}"
      EMBEDDING_QUERY_PREFIX: "${EMBEDDING_QUERY_PREFIX:-}"
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-64}
      INDEX_EMBED_BATCH_RECORDS: ${INDEX_EMBED_BATCH_RECORDS:-64}
      EMBEDDING_HTTP_TIMEOUT_SECONDS: ${EMBEDDING_HTTP_TIMEOUT_SECONDS:-120}
      DOCUMENT_CHUNK_WORDS: ${DOCUMENT_CHUNK_WORDS:-420}
      DOCUMENT_CHUNK_OVERLAP_WORDS: ${DOCUMENT_CHUNK_OVERLAP_WORDS:-64}
      DOCUMENT_INGESTION_URL: ${DOCUMENT_INGESTION_URL:-http://ingestion:8091/extract}
      INGESTION_HTTP_TIMEOUT_SECONDS: ${INGESTION_HTTP_TIMEOUT_SECONDS:-90}
      CONTEXT_RETRIEVAL_K: ${CONTEXT_RETRIEVAL_K:-24}
      CONTEXT_MAX_CHARS: ${CONTEXT_MAX_CHARS:-48000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-5}
      CLAUDE_MAX_TOKENS: ${CLAUDE_MAX_TOKENS:-6000}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      BRAVE_SEARCH_ENDPOINT: ${BRAVE_SEARCH_ENDPOINT:-https://api.search.brave.com/res/v1/web/search}
      RESEARCH_MAX_CONCURRENCY: ${RESEARCH_MAX_CONCURRENCY:-8}
      RESEARCH_HTTP_TIMEOUT_SECONDS: ${RESEARCH_HTTP_TIMEOUT_SECONDS:-30}
      RESEARCH_MAX_BODY_BYTES: ${RESEARCH_MAX_BODY_BYTES:-8388608}
      RESEARCH_USER_AGENT: ${RESEARCH_USER_AGENT:-ClinicalGrantWorkbench/0.8.0}
      CLINICAL_SCENARIO_MAX_COMBINATIONS: ${CLINICAL_SCENARIO_MAX_COMBINATIONS:-10000}
      MODEL_HTTP_TIMEOUT_SECONDS: ${MODEL_HTTP_TIMEOUT_SECONDS:-300}
      EMBEDDING_HEALTH_TTL_SECONDS: ${EMBEDDING_HEALTH_TTL_SECONDS:-600}
      CLAUDE_TASK_KINDS: ${CLAUDE_TASK_KINDS:-requirement_decomposition,sponsor_compliance_compilation,investigator_interview,research_planning,evidence_validation,competitor_profile,competitive_positioning,complex_scientific_synthesis,review_simulation,causal_analysis}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
      OPENBLAS_NUM_THREADS: ${OPENBLAS_NUM_THREADS:-1}
      RAYON_NUM_THREADS: ${RAYON_NUM_THREADS:-4}
      RETRIEVAL_WEIGHT_SEMANTIC: ${RETRIEVAL_WEIGHT_SEMANTIC:-0.45}
      RETRIEVAL_WEIGHT_LEXICAL: ${RETRIEVAL_WEIGHT_LEXICAL:-0.25}
      RETRIEVAL_WEIGHT_EVIDENCE: ${RETRIEVAL_WEIGHT_EVIDENCE:-0.20}
      RETRIEVAL_WEIGHT_FRESHNESS: ${RETRIEVAL_WEIGHT_FRESHNESS:-0.10}
      RETRIEVAL_GRAPH_BOOST: ${RETRIEVAL_GRAPH_BOOST:-0.08}
      RETRIEVAL_CANDIDATE_MULTIPLIER: ${RETRIEVAL_CANDIDATE_MULTIPLIER:-4}
      RETRIEVAL_OPENMP_THRESHOLD: ${RETRIEVAL_OPENMP_THRESHOLD:-4096}
      RETRIEVAL_FRESHNESS_HALF_LIFE_DAYS: ${RETRIEVAL_FRESHNESS_HALF_LIFE_DAYS:-365}
      BM25_K1: ${BM25_K1:-1.2}
      BM25_B: ${BM25_B:-0.75}
      ORGANIZATION_NAME: ${ORGANIZATION_NAME:-Organization}
      COMPETITIVE_CONFIG_PATH: ${COMPETITIVE_CONFIG_PATH:-/app/config/competitive_intelligence.json}
      WORKFLOW_DEFINITIONS_PATH: ${WORKFLOW_DEFINITIONS_PATH:-/app/config/workflow_definitions.json}
      COMPETITIVE_HTTP_TIMEOUT_SECONDS: ${COMPETITIVE_HTTP_TIMEOUT_SECONDS:-45}
      COMPETITIVE_REFRESH_TTL_SECONDS: ${COMPETITIVE_REFRESH_TTL_SECONDS:-14400}
      COMPETITIVE_BACKGROUND_REFRESH_ENABLED: ${COMPETITIVE_BACKGROUND_REFRESH_ENABLED:-true}
      COMPETITIVE_BACKGROUND_REFRESH_SECONDS: ${COMPETITIVE_BACKGROUND_REFRESH_SECONDS:-14400}
      COMPETITIVE_USER_AGENT: ${COMPETITIVE_USER_AGENT:-GrantWriterCompetitive/1.0}
      COMPETITIVE_HOME_ORGANIZATION_ALIASES: ${COMPETITIVE_HOME_ORGANIZATION_ALIASES:-}
      OPENALEX_MAILTO: ${OPENALEX_MAILTO:-}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
    depends_on:
      ingestion:
        condition: service_healthy
    volumes:
      - grant-data:/workspace
      - ./config:/app/config:ro
    ports: ["127.0.0.1:8080:8080"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    mem_limit: ${CORE_MEMORY_LIMIT:-1536m}
    cpus: ${CORE_CPU_LIMIT:-4.0}
    pids_limit: 512
    read_only: true
    init: true
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs: ["/tmp:size=128m,mode=1777"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 20s

  renderer:
    build:
      context: .
      dockerfile: Dockerfile.renderer
    environment:
      PROJECT_ROOT: /workspace/projects
      OUTPUT_ROOT: /exports
      RENDERER_CONFIG_ROOT: /app/config
      ORGANIZATION_NAME: ${ORGANIZATION_NAME:-Organization}
      COMPETITIVE_UPDATE_LABEL: ${COMPETITIVE_UPDATE_LABEL:-Competitive Edge Auto-Update}
      PYTHONDONTWRITEBYTECODE: "1"
      HOME: /tmp
    volumes:
      - grant-data:/workspace
      - ./config:/app/config:ro
      - ${GRANT_EXPORT_HOME:-./exports}:/exports
    ports: ["127.0.0.1:8090:8090"]
    mem_limit: ${RENDERER_MEMORY_LIMIT:-768m}
    cpus: ${RENDERER_CPU_LIMIT:-1.5}
    pids_limit: 256
    read_only: true
    init: true
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs: ["/tmp:size=512m,mode=1777"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    environment:
      CORE_URL: http://core:8080
      RENDERER_URL: http://renderer:8090
      GRANT_WORKSPACE: /workspace
      UI_CONFIG_ROOT: /app/config
      ORGANIZATION_NAME: ${ORGANIZATION_NAME:-Organization}
      GRANT_BUILD_VERSION: ${GRANT_BUILD_VERSION:-0.8.0}
      AUTH_MODE: ${AUTH_MODE:-internal_accounts}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-43200}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://127.0.0.1:7860}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-127.0.0.1}
      GRANT_SECTIONS: ${GRANT_SECTIONS:-}
      COMPETITIVE_UI_POLL_SECONDS: ${COMPETITIVE_UI_POLL_SECONDS:-14400}
      COLLABORATION_UI_POLL_SECONDS: ${COLLABORATION_UI_POLL_SECONDS:-5}
      COMPETITIVE_UPDATE_LABEL: ${COMPETITIVE_UPDATE_LABEL:-Competitive Edge Auto-Update}
      PYTHONDONTWRITEBYTECODE: "1"
      HOME: /tmp
    depends_on:
      core:
        condition: service_healthy
      renderer:
        condition: service_healthy
    volumes:
      - grant-data:/workspace
      - ./config:/app/config:ro
      - ${GRANT_EXPORT_HOME:-./exports}:/exports
    ports: ["127.0.0.1:7860:7860"]
    mem_limit: ${UI_MEMORY_LIMIT:-768m}
    cpus: ${UI_CPU_LIMIT:-1.0}
    pids_limit: 256
    read_only: true
    init: true
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs: ["/tmp:size=256m,mode=1777"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  grant-data:
  grant-embedding-models:
  grant-ollama-models:
