services:
  core:
    environment:
      AUTH_MODE: trusted_headers

  ui:
    environment:
      AUTH_MODE: trusted_headers

  identity-proxy:
    image: nginx:1.27-alpine
    environment:
      SHARED_ORGANIZATION_ID: ${SHARED_ORGANIZATION_ID:?Set a stable organization ID}
    volumes:
      - ./deployment/identity-proxy:/etc/nginx/templates:ro
    expose: ["8080"]
    depends_on:
      ui:
        condition: service_started
    read_only: true
    init: true
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    tmpfs: ["/var/cache/nginx:size=32m", "/var/run:size=8m", "/tmp:size=32m"]

  oidc-gateway:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
    command:
      - --provider=oidc
      - --http-address=0.0.0.0:4180
      - --upstream=http://identity-proxy:8080
      - --reverse-proxy=true
      - --set-xauthrequest=true
      - --pass-user-headers=true
      - --skip-provider-button=true
      - --cookie-secure=true
      - --cookie-httponly=true
      - --cookie-samesite=lax
      - --email-domain=*
    environment:
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:?Set the institutional OIDC issuer}
      OAUTH2_PROXY_CLIENT_ID: ${OIDC_CLIENT_ID:?Set the OIDC client ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set the OIDC client secret}
      OAUTH2_PROXY_COOKIE_SECRET: ${OIDC_COOKIE_SECRET:?Set a 32-byte base64 cookie secret}
      OAUTH2_PROXY_REDIRECT_URL: ${OIDC_REDIRECT_URL:?Set the public callback URL}
      OAUTH2_PROXY_USER_ID_CLAIM: ${OIDC_USER_ID_CLAIM:-sub}
    ports: ["${SHARED_HTTPS_BIND:-127.0.0.1:4180}:4180"]
    depends_on:
      identity-proxy:
        condition: service_started
    read_only: true
    init: true
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs: ["/tmp:size=32m"]

